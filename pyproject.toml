[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhouyi-ai-cpg-ei"
version = "0.1.0"
description = "Research prototypes for Combinatorial Parallel Generation & Epistemic Intelligence"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
tokenizers = ["tokenizers>=0.20,<1"]
model = ["torch>=2.4,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["prototype*", "orchestrator*"]
exclude = ["tests*", "data*", "schemas*"]
