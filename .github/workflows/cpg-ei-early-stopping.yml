name: CPG-EI development-loss early stopping

on:
  push:
    branches:
      - research/cpg-ei-early-stopping-baseline-v1-2026-11-13
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  early-stopping-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run early-stopping contract tests
        run: |
          python -m unittest discover -s tests -p 'test_cpg_ei_early_stopping.py' -v
      - name: Run 8-family early-stopping experiment
        run: |
          python -m prototype.cpg_ei_early_stopping \
            --families 8 --input-dim 8 --output-dim 8 \
            --seed 20261114 --max-epochs 600 --patience 30 \
            --min-delta 0.00001 --learning-rate 0.1 --l2 0.0001 \
            --json artifacts/early-stopping.json
      - name: Upload early-stopping report
        uses: actions/upload-artifact@v4
        with:
          name: zhouyi-cpg-ei-early-stopping-v1
          path: artifacts/early-stopping.json
          if-no-files-found: error
