name: M64 instrumental variable diagnostics
on:
  pull_request:
    branches:
      - research/yixiang-m63-frontdoor-identification-2026-11-14
    paths:
      - "prototype/yixiang_m64_instrumental_variable.py"
      - "tests/test_yixiang_m64_instrumental_variable.py"
      - "docs/YIXIANG_M64_INSTRUMENTAL_VARIABLE_V0_1.md"
      - ".github/workflows/m64-instrumental-variable.yml"
  workflow_dispatch:
jobs:
  m64-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run M64 IV diagnostics
        run: python -m unittest tests.test_yixiang_m64_instrumental_variable -v
