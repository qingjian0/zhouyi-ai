name: CPG-EI empirical-Bayes held-out-family meta learner

on:
  pull_request:
    paths:
      - "prototype/cpg_ei_empirical_bayes_meta_learner.py"
      - "tests/test_cpg_ei_empirical_bayes_meta_learner.py"
      - ".github/workflows/cpg-ei-empirical-bayes-meta-learner.yml"
      - "prototype/cpg_ei_heldout_family_protocol.py"
      - "prototype/cpg_ei_mixed_operator_data.py"
      - "prototype/cpg_ei_mixed_operator_discovery.py"
  push:
    branches:
      - main
    paths:
      - "prototype/cpg_ei_empirical_bayes_meta_learner.py"
      - "tests/test_cpg_ei_empirical_bayes_meta_learner.py"
      - ".github/workflows/cpg-ei-empirical-bayes-meta-learner.yml"
      - "prototype/cpg_ei_heldout_family_protocol.py"
      - "prototype/cpg_ei_mixed_operator_data.py"
      - "prototype/cpg_ei_mixed_operator_discovery.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empirical-bayes-meta-learner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository test dependencies
        run: python -m pip install "cryptography>=42,<47" "numpy>=1.26,<3"
      - name: Run focused leakage and meta-learning tests
        run: python -m unittest discover -s tests -p 'test_cpg_ei_empirical_bayes_meta_learner.py' -v
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Run three-seed held-out-family benchmark
        run: |
          mkdir -p artifacts
          python -m prototype.cpg_ei_empirical_bayes_meta_learner \
            --families 1600 \
            --seeds 20261114 20261115 20261116 \
            --support-sizes 16 32 64 \
            --json artifacts/empirical-bayes-meta-results.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: zhouyi-cpg-ei-empirical-bayes-meta-v1
          path: artifacts/empirical-bayes-meta-results.json
          if-no-files-found: error
          retention-days: 30
