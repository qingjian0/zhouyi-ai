name: cpg-ei-proposal-split-size-sweep

on:
  push:
    branches:
      - research/cpg-ei-proposal-split-size-sweep-2026-11-13
  pull_request:
    branches:
      - research/cpg-ei-selection-multiseed-2026-11-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection-split-size-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ed25519 verification dependency
        run: python -m pip install "cryptography>=42.0.0"
      - name: Validate split partition helper
        run: python -m unittest tests.test_cpg_ei_selection_split_sweep -v
      - name: Run proposal split-size sweep
        run: |
          mkdir -p benchmark-results
          python -m prototype.cpg_ei_selection_split_sweep --json | tee benchmark-results/cpg-ei-proposal-split-size.json
      - name: Upload split-size measurements
        uses: actions/upload-artifact@v4
        with:
          name: cpg-ei-proposal-split-size-${{ github.sha }}
          path: benchmark-results/cpg-ei-proposal-split-size.json
          if-no-files-found: error
          retention-days: 30
