name: Relation algebra transfer integration

on:
  push:
    branches:
      - integration/m23-m70-on-main-2026-11-17
    paths:
      - "prototype/relation_algebra*.py"
      - "prototype/yixiang_relation_invariants.py"
      - "tests/test_relation_algebra*.py"
      - "tests/test_yixiang_relation_invariants.py"
      - ".github/workflows/relation-algebra-transfer.yml"
  pull_request:
    branches:
      - main
    paths:
      - "prototype/relation_algebra*.py"
      - "prototype/yixiang_relation_invariants.py"
      - "tests/test_relation_algebra*.py"
      - "tests/test_yixiang_relation_invariants.py"
      - ".github/workflows/relation-algebra-transfer.yml"

jobs:
  relation-algebra-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test relation algebra and cross-module transfer gates
        run: |
          python -m unittest discover -s tests -p 'test_relation_algebra*.py' -v
          python -m unittest discover -s tests -p 'test_yixiang_relation_invariants.py' -v
