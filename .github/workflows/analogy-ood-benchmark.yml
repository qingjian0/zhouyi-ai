name: Analogy relation-preservation OOD benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'prototype/analogy.py'
      - 'prototype/analogy_benchmark.py'
      - 'tests/test_analogy_benchmark.py'
      - 'docs/ANALOGY_BENCHMARK_V0_1.md'
      - '.github/workflows/analogy-ood-benchmark.yml'

permissions:
  contents: read

jobs:
  analogy-ood:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run leakage and relation-preservation tests
        run: python -m unittest discover -s tests -p 'test_analogy_benchmark.py' -v
      - name: Generate deterministic benchmark report
        run: python -m prototype.analogy_benchmark > /tmp/analogy-benchmark.json
      - name: Validate report JSON
        run: python -m json.tool /tmp/analogy-benchmark.json > /dev/null
