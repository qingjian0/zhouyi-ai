name: cpg-ei-search-benchmark

on:
  push:
    branches:
      - research/cpg-ei-admissible-branch-bound-2026-11-12

jobs:
  exact-vs-branch-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run matched exact-vs-branch-bound benchmark
        run: python -m benchmarks.benchmark_cpg_ei_search --sizes 4 8 12 16 --seeds 5 --repeats 3
