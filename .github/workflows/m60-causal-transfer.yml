name: M60 causal intervention controls

on:
  pull_request:
    branches:
      - research/yixiang-m59-classical-evidence-2026-11-14
    paths:
      - "prototype/yixiang_m60_causal_transfer.py"
      - "tests/test_yixiang_m60_causal_transfer.py"
      - ".github/workflows/m60-causal-transfer.yml"
  workflow_dispatch:

jobs:
  m60-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run M60 causal intervention tests
        run: python -m unittest tests.test_yixiang_m60_causal_transfer -v
