name: cpg-ei-conditional-motif-proposals

on:
  push:
    branches:
      - research/cpg-ei-conditional-motif-proposals-2026-11-13
  pull_request:
    branches:
      - research/cpg-ei-second-parity-teacher-rebased-2026-11-12

jobs:
  conditional-motif-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run conditional motif proposal tests
        run: python -m unittest tests.test_cpg_ei_conditional_motif_proposals -v
