name: MTS-0 training gate

on:
  push:
    branches:
      - work/mts0-prequential-runner-2026-11-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mts0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full unit test suite
        run: python -m unittest discover -s tests -v
      - name: Run deterministic MTS-0 smoke experiment
        run: |
          python -m prototype.mts0_runner \
            --seed 7 --train-samples 1200 --test-samples 400 --epochs 180 --json \
            > mts0-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("mts0-smoke.json").read_text())
          audit = result["audit"]
          assert audit["prediction_commits"] == 400
          assert audit["locked_test_reveals"] == 400
          assert audit["learner_visible_locked_test_reveals"] == 0
          assert audit["selector_visible_locked_test_reveals"] == 0
          assert audit["evaluator_visible_locked_test_reveals"] == 400
          assert audit["prediction_batch_sealed_before_reveal"] is True
          assert audit["all_predictions_committed_before_reveal"] is True
          print(json.dumps({"metrics": result["metrics"], "audit": audit}, indent=2))
          PY
