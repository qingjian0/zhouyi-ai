name: cpg-ei-random-teacher-families

on:
  push:
    branches:
      - research/cpg-ei-random-teacher-families-2026-11-13
  pull_request:
    branches:
      - research/cpg-ei-locked-test-protocol-2026-11-13
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpg-ei-random-teacher-families-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  random-teachers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run teacher-family and split tests
        run: python -m unittest tests.test_cpg_ei_random_teacher_families -v
      - name: Run ten-family benchmark
        run: |
          set -o pipefail
          mkdir -p benchmark-results
          python -m prototype.cpg_ei_random_teacher_families | tee benchmark-results/cpg-ei-random-teacher-families.json
      - name: Upload teacher-family report
        uses: actions/upload-artifact@v4
        with:
          name: cpg-ei-random-teacher-families-${{ github.sha }}
          path: benchmark-results/cpg-ei-random-teacher-families.json
          if-no-files-found: error
          retention-days: 30
