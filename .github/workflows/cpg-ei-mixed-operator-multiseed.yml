name: CPG-EI mixed-operator independent-seed replication

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  multiseed-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run replication and control contract tests
        run: |
          python -m unittest discover -s tests -p 'test_cpg_ei_mixed_operator_multiseed.py' -v
      - name: Run five independent 8-family replications with controls
        run: |
          python -m prototype.cpg_ei_mixed_operator_multiseed \
            --seeds 20261114,20261115,20261116,20261117,20261118 --families 8 \
            --input-dim 8 --output-dim 8 --epochs 120 \
            --learning-rate 0.1 --l2 0.0001 \
            --json artifacts/mixed-operator-multiseed.json
      - name: Upload machine-readable replication report
        uses: actions/upload-artifact@v4
        with:
          name: zhouyi-cpg-ei-mixed-operator-multiseed-v3
          path: artifacts/mixed-operator-multiseed.json
          if-no-files-found: error
