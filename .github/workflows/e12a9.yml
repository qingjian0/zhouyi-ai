name: E12-A9 symbolic prior ablation
on:
  pull_request:
    branches:
      - "research/e12a9-symbolic-prior-ablation-2026-11-11"
  push:
    branches:
      - "research/e12a9-symbolic-prior-ablation-2026-11-11"
jobs:
  e12a9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_e12a9_symbolic_prior_ablation -v
      - run: python -m prototype.e12a9_symbolic_prior_ablation --json --seeds 100 > e12a9-results.json
      - run: python -c "import json; d=json.load(open('e12a9-results.json')); assert d['seed_count']==100; assert set(d['families'])=={'aligned','uniform','misaligned','permuted'}"
