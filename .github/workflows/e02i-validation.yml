name: E02-I focused validation

on:
  push:
    branches: [research/e02i-ci-runner]

jobs:
  e02i-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run E02-I unit tests
        run: python -m unittest tests.test_e02i_relation_evolution -v
      - name: Run E02-I 100-seed six-scenario validation
        run: python -m prototype.e02i_relation_evolution --seeds 100 --start-seed 5000
