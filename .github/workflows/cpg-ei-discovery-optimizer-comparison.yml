name: cpg-ei-discovery-optimizer-comparison

on:
  push:
    branches:
      - research/cpg-ei-discovery-optimizer-comparison-2026-11-13
  pull_request:
    branches:
      - research/cpg-ei-adam-optimizer-comparison-v2-2026-11-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-optimizer-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run optimizer propagation and sweep tests
        run: |
          python -m unittest tests.test_cpg_ei_joint_proposals.TestCpgEiJointMotifProposals.test_optimizer_is_propagated_to_baseline_and_candidate_fits -v
          python -m unittest tests.test_cpg_ei_discovery_optimizer_comparison -v
      - name: Run paired five-seed discovery comparison
        run: |
          set -o pipefail
          mkdir -p benchmark-results
          python -m prototype.cpg_ei_discovery_optimizer_comparison --epochs-per-candidate 50 --max-motifs 3 | tee benchmark-results/cpg-ei-discovery-optimizer-comparison.json
      - name: Upload discovery comparison report
        uses: actions/upload-artifact@v4
        with:
          name: cpg-ei-discovery-optimizer-comparison-${{ github.sha }}
          path: benchmark-results/cpg-ei-discovery-optimizer-comparison.json
          if-no-files-found: error
          retention-days: 30
