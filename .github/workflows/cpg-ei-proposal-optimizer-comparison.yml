name: cpg-ei-proposal-optimizer-comparison

on:
  push:
    branches:
      - research/cpg-ei-proposal-adam-epoch-followup-2026-11-13
  pull_request:
    branches:
      - research/cpg-ei-discovery-optimizer-comparison-2026-11-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proposal-optimizer-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run focused optimizer candidate-discovery test
        run: python -m unittest tests.test_cpg_ei_proposal_optimizer_comparison -v
      - name: Run five-seed SGD versus Adam candidate-discovery sweep
        run: |
          set -o pipefail
          mkdir -p benchmark-results
          python -m prototype.cpg_ei_proposal_optimizer_comparison --epochs 50,100,200 | tee benchmark-results/cpg-ei-proposal-optimizer-comparison.json
      - name: Upload candidate-discovery report
        uses: actions/upload-artifact@v4
        with:
          name: cpg-ei-proposal-optimizer-comparison-${{ github.sha }}
          path: benchmark-results/cpg-ei-proposal-optimizer-comparison.json
          if-no-files-found: error
          retention-days: 30
