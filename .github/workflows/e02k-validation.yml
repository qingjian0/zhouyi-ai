name: E02-K focused validation

on:
  push:
    branches: [research/e02k-adaptive-evidence]

jobs:
  e02k-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run E02-K adaptive evidence tests
        run: python -m unittest tests.test_e02k_adaptive_evidence -v
