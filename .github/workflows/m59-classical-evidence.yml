name: M59 classical evidence provenance

on:
  pull_request:
    branches:
      - research/yixiang-m58-autonomous-mapping-2026-11-14
    paths:
      - "prototype/yixiang_m59_classical_evidence.py"
      - "tests/test_yixiang_m59_classical_evidence.py"
      - ".github/workflows/m59-classical-evidence.yml"
  workflow_dispatch:

jobs:
  m59-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run M59 evidence provenance tests
        run: python -m unittest tests.test_yixiang_m59_classical_evidence -v
