name: CPG-EI semantic identifiability audit

on:
  push:
    branches:
      - research/cpg-ei-semantic-identifiability-v1-2026-11-13
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  semantic-identifiability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run focused discovery contract tests
        run: |
          python -m unittest discover -s tests -p 'test_cpg_ei_mixed_operator_data.py' -v
          python -m unittest discover -s tests -p 'test_cpg_ei_mixed_operator_discovery.py' -v
      - name: Run full 102,400-row semantic identifiability audit
        run: |
          python -m prototype.cpg_ei_mixed_operator_discovery \
            --families 400 --input-dim 8 --output-dim 8 \
            --seed 20261114 --json artifacts/mixed-operator-identifiability.json
      - name: Upload reproducible report
        uses: actions/upload-artifact@v4
        with:
          name: zhouyi-cpg-ei-semantic-identifiability-v1
          path: artifacts/mixed-operator-identifiability.json
          if-no-files-found: error
