name: e12a6-rss-benchmark

on:
  push:
    branches:
      - research/e12a6-rss-restore-benchmark-2026-11-12
  pull_request:
    branches:
      - refactor/e12a6-sqlite-backed-receipt-metadata-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependency
        run: python -m pip install "cryptography>=42.0.0"
      - name: Run isolated restore RSS sweep
        run: |
          mkdir -p benchmark-results
          python -m prototype.e12a6_rss_benchmark --sizes 1000,10000,50000 --batch-size 128 | tee benchmark-results/e12a6-restore-rss.json
      - name: Upload RSS measurements
        uses: actions/upload-artifact@v4
        with:
          name: e12a6-restore-rss-${{ github.sha }}
          path: benchmark-results/e12a6-restore-rss.json
          if-no-files-found: error
          retention-days: 30
