name: tests

on:
  push:
    branches: [main, research/e02i-ci-runner, research/e02i-persistent-evidence, research/e02i2-relation-lineage, research/e02i2-hidden-identity-benchmark, research/e02i2c-event-adjudication, research/e02i2c-hidden-event-benchmark, research/e02i2c-integrity-hardening, research/e02i2c-metadata-attack, research/e02i2c-scenario-diversity-impl]
  pull_request:
    branches: [main, research/e02e-autonomous-discovery, research/e02f-falsification, research/e02g-multienvironment-stability, research/e02i-relation-evolution, research/e02h-baseline, research/e02i-persistent-evidence, research/e02i2-relation-lineage, research/e02i2c-hidden-event-benchmark, research/e02i2c-integrity-hardening, research/e02i2c-scenario-diversity-impl]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run E01 demonstration
        run: python -m prototype.e01_sparse_composition --json
      - name: Run E01-B five-seed evaluation
        run: python -m prototype.e01_multiseed --seeds 5 --start-seed 7 --json
      - name: Run E01-C compositional OOD evaluation
        run: python -m prototype.e01_ood_multiseed --seeds 5 --start-seed 7 --json
      - name: Run E02-A higher-order synergy evaluation
        run: python -m prototype.e02_higher_order --seeds 5 --start-seed 7 --json
      - name: Run E02-B ternary relation generator audit
        run: python -m prototype.e02_ternary --examples 900 --seed 7
      - name: Run E02-B pairwise vs third-order learners
        run: python -m prototype.e02_ternary_learners --seeds 5 --start-seed 7 --json
      - name: Run E02-C hyperedge lifecycle tests
        run: python -m unittest tests.test_e02_edge_lifecycle -v
      - name: Run E02-D held-out rule-family induction
        run: python -m prototype.e02_rule_ood --seed 17 --support-size 6 --json
      - name: Run E02-D multi-seed support identifiability sweep
        run: python -m prototype.e02_rule_ood --sweep --seeds 100 --start-seed 100 --json
      - name: Run E02-E multi-seed autonomous relation discovery
        run: python -m prototype.e02e_discovery --seeds 20 --start-seed 7 --json
      - name: Run E02-F train-only nuisance falsification
        run: python -m prototype.e02f_falsification --seeds 100 --start-seed 100
      - name: Run E02-G multi-environment stability classification
        run: python -m prototype.e02g_multienvironment --seeds 50 --start-seed 700 --repeats 5
      - name: Run E02-H unknown Boolean rule discovery
        run: python -m prototype.e02h_boolean_rules --seeds 30 --start-seed 900
      - name: Run E02-I evidence-gated relation evolution
        run: python -m prototype.e02i_relation_evolution --seeds 20 --start-seed 1200
      - name: Run E02-I2 identity lineage ledger tests
        run: python -m unittest tests.test_e02i2_lineage -v
      - name: Run E02-I2 identity matching baseline tests
        run: python -m unittest tests.test_e02i2_matching -v
      - name: Run E02-I2 hidden identity benchmark tests
        run: python -m unittest tests.test_e02i2_hidden_identity -v
      - name: Run E02-I2 hidden identity benchmark (30 seeds)
        run: python -m prototype.e02i2_hidden_identity --seeds 30 --start-seed 7000
      - name: Run E02-I2-C evidence adjudication tests
        run: python -m unittest tests.test_e02i2c_adjudication -v
      - name: Run E02-I2-C hidden event benchmark tests
        run: python -m unittest tests.test_e02i2c_hidden_event_benchmark -v
      - name: Run E02-I2-C hidden event development benchmark (train)
        run: python -m prototype.e02i2c_hidden_event_benchmark --seeds 20 --start-seed 1000 --split train
      - name: Run E02-I2-C hidden event development benchmark (gate)
        run: python -m prototype.e02i2c_hidden_event_benchmark --seeds 20 --start-seed 2000 --split gate
      - name: Run E02-I2-C-E metadata attacker unit tests
        run: python -m unittest tests.test_e02i2c_metadata_attack -v
      - name: Run E02-I2-C-E metadata-only leakage attack (30 seed blocks)
        run: python -m prototype.e02i2c_metadata_attack --seeds 30 --train-start-seed 1000 --gate-start-seed 10000 --bootstrap-samples 1000 > e02i2c_metadata_attack.json
      - name: Run E02-I2-C-F scenario diversity tests
        run: python -m unittest tests.test_e02i2c_scenario_diversity -v
      - name: Run E02-I2-C-F scenario diversity prototype (30 seed blocks)
        run: python -m prototype.e02i2c_scenario_diversity --seeds 30 > e02i2c_scenario_diversity.json
      - name: Upload E02-I2-C-F scenario diversity report
        uses: actions/upload-artifact@v4
        with:
          name: e02i2c-scenario-diversity-report
          path: e02i2c_scenario_diversity.json
          if-no-files-found: error
      - name: Upload E02-I2-C-E metadata attack report
        uses: actions/upload-artifact@v4
        with:
          name: e02i2c-metadata-attack-report
          path: e02i2c_metadata_attack.json
          if-no-files-found: error

  e02i2-hidden-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run E02-I2 hidden identity benchmark tests
        run: python -m unittest tests.test_e02i2_hidden_identity -v
      - name: Run E02-I2 hidden identity benchmark (30 seeds)
        run: python -m prototype.e02i2_hidden_identity --seeds 30 --start-seed 7000
