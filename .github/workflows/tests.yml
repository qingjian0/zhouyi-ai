name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run N0.10 higher-order necessary benchmark
        run: |
          python -m unittest tests.test_n10_higher_order_benchmark -v
          python -m prototype.n10_higher_order_benchmark \
            --seeds 5 --start-seed 7 --train-samples 3000 \
            --test-samples 1504 --epochs 120 --json > n10-higher-order.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("n10-higher-order.json").read_text())
          summary = result["summary"]
          assert result["seed_count"] == 5
          assert summary["unary_pairwise_triple.accuracy"]["mean"] >= 0.95
          assert 0.40 <= summary["unary_pairwise.accuracy"]["mean"] <= 0.60
          assert 0.40 <= summary["triple_model_after_triple_mask.accuracy"]["mean"] <= 0.60
          print(json.dumps({"summary": summary}, indent=2))
          PY
      - name: Upload N0.10 higher-order result artifact
        uses: actions/upload-artifact@v4
        with:
          name: n10-higher-order-results
          path: n10-higher-order.json
          if-no-files-found: error
      - name: Run N0.11 cyclic composition OOD benchmark
        run: |
          python -m unittest tests.test_n11_cyclic_composition_ood -v
          python -m prototype.n11_cyclic_composition_ood \
            --seeds 5 --start-seed 7 --train-samples 3000 \
            --test-samples 1500 --epochs 120 --json > n11-cyclic-ood.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("n11-cyclic-ood.json").read_text())
          summary = result["summary"]
          assert result["seed_count"] == 5
          assert result["distribution_shift"]["train_test_role_a_regions_are_disjoint"]
          assert summary["unary_pairwise_triple.accuracy"]["mean"] >= 0.85
          assert summary["unary_pairwise_triple.balanced_accuracy"]["mean"] >= 0.85
          assert 0.38 <= summary["unary_only.accuracy"]["mean"] <= 0.62
          assert summary["triple_model_after_triple_mask.accuracy"]["mean"] <= 0.35
          assert 0.45 <= summary["unary_pairwise_triple.positive_rate"]["mean"] <= 0.55
          print(json.dumps({"summary": summary}, indent=2))
          PY
      - name: Upload N0.11 cyclic OOD result artifact
        uses: actions/upload-artifact@v4
        with:
          name: n11-cyclic-ood-results
          path: n11-cyclic-ood.json
          if-no-files-found: error
      - name: Run E01 demonstration
        run: python -m prototype.e01_sparse_composition --json
      - name: Run E01-B five-seed evaluation
        run: python -m prototype.e01_multiseed --seeds 5 --start-seed 7 --json
      - name: Run E01-C compositional OOD evaluation
        run: python -m prototype.e01_ood_multiseed --seeds 5 --start-seed 7 --json
      - name: Run E02-A higher-order synergy evaluation
        run: python -m prototype.e02_higher_order --seeds 5 --start-seed 7 --json
      - name: Run E02-B ternary relation generator audit
        run: python -m prototype.e02_ternary --examples 900 --seed 7
      - name: Run E02-B pairwise vs third-order learners
        run: python -m prototype.e02_ternary_learners --seeds 5 --start-seed 7 --json
      - name: Run E02-C hyperedge lifecycle tests
        run: python -m unittest tests.test_e02_edge_lifecycle -v
      - name: Run E02-D held-out rule-family induction
        run: python -m prototype.e02_rule_ood --seed 17 --support-size 6 --json
      - name: Run E02-D multi-seed support identifiability sweep
        run: python -m prototype.e02_rule_ood --sweep --seeds 100 --start-seed 100 --json
