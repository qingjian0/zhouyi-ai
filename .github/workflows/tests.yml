name: tests

on:
  push:
    branches: [main, research/e12a3-m0-composition-engine-2026-11-11, research/e12a6-lifecycle-contract-2026-11-11, research/e12a6-e02d-lifecycle-runner-2026-11-11, research/e12a7-orthogonal-lifecycle-prototype-2026-11-11, research/e12a8-evaluator-firewall-2026-11-11, research/e12a9-evidence-bridge-2026-11-11, research/e12a10-signed-evaluator-receipts-2026-11-11]
  pull_request:
    branches: [main, research/e12a3-m0-composition-engine-2026-11-11, research/e12a6-lifecycle-contract-2026-11-11, research/e12a7-orthogonal-lifecycle-prototype-2026-11-11]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional security dependency
        run: python -m pip install "cryptography>=42"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run E12-A3-M0 focused tests
        run: python -m unittest tests.test_e12a3_compositional_induction -v
      - name: Run E12-A3-M0 smoke test
        run: python -m prototype.e12a3_compositional_induction
      - name: Run E01 demonstration
        run: python -m prototype.e01_sparse_composition --json
      - name: Run E01-B five-seed evaluation
        run: python -m prototype.e01_multiseed --seeds 5 --start-seed 7 --json
      - name: Run E01-C compositional OOD evaluation
        run: python -m prototype.e01_ood_multiseed --seeds 5 --start-seed 7 --json
      - name: Run E02-A higher-order synergy evaluation
        run: python -m prototype.e02_higher_order --seeds 5 --start-seed 7 --json
      - name: Run E02-B ternary relation generator audit
        run: python -m prototype.e02_ternary --examples 900 --seed 7
      - name: Run E02-B pairwise vs third-order learners
        run: python -m prototype.e02_ternary_learners --seeds 5 --start-seed 7 --json
      - name: Run E02-C hyperedge lifecycle tests
        run: python -m unittest tests.test_e02_edge_lifecycle -v
      - name: Run E12-A7 orthogonal lifecycle tests
        run: python -m unittest tests.test_e12a7_orthogonal_lifecycle -v
      - name: Run E12-A10 signed evaluator receipt tests
        run: python -m unittest tests.test_e12a10_signed_evaluator_receipts -v
      - name: Run E12-A9 evidence bridge tests
        run: python -m unittest tests.test_e12a9_evidence_bridge -v
      - name: Run E12-A8 evaluator firewall tests
        run: python -m unittest tests.test_e12a8_evaluator_firewall -v
      - name: Run E12-A8 x E02-D process-separated runner
        run: python -m prototype.e12a8_e02d_runner --seed 17 --support-size 6 --json
      - name: Run E12-A8 x E02-D integration tests
        run: python -m unittest tests.test_e12a8_e02d_runner -v
      - name: Run E12-A6 x E02-D lifecycle runner
        run: python -m prototype.e12a6_e02_lifecycle_runner --seed 17 --support-size 6 --json
      - name: Run E12-A6 x E02-D lifecycle tests
        run: python -m unittest tests.test_e12a6_e02_lifecycle_runner -v
      - name: Run E02-D held-out rule-family induction
        run: python -m prototype.e02_rule_ood --seed 17 --support-size 6 --json
      - name: Run E02-D multi-seed support identifiability sweep
        run: python -m prototype.e02_rule_ood --sweep --seeds 100 --start-seed 100 --json
