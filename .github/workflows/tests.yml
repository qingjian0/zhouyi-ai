name: tests

on:
  push:
    branches: [main, dev, integration/m1-m2-e09-runtime-on-main-2026-11-17-batch1]
    paths:
      - 'prototype/**'
      - 'tests/**'
      - 'orchestrator/**'
      - 'schemas/**'
      - 'data/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main, dev, integration/m23-m70-on-main-2026-11-17, integration/m1-m2-e09-runtime-on-main-2026-11-17-batch1, research/e02e-autonomous-discovery, research/e02f-falsification, research/e02g-multienvironment-stability, research/e02h-boolean-rule-discovery, research/e02i-streaming-drift-lifecycle]
    paths:
      - 'prototype/**'
      - 'tests/**'
      - 'orchestrator/**'
      - 'schemas/**'
      - 'data/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install E09 verification dependency
        run: python -m pip install "cryptography>=42,<47" "numpy>=1.26,<3"
      - name: Run E12-A6 real-process crash recovery test
        timeout-minutes: 1
        run: python -m unittest tests.test_e12a6_zpcm_persistence.PersistentLifecycleTests.test_real_process_kill_after_atomic_bundle_commit_recovers_and_replays -v
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run orchestrator CLI plan
        run: python -m orchestrator.cli orchestrator/examples/quickstart.json --plan

  detect-research:
    runs-on: ubuntu-latest
    outputs:
      e01: ${{ steps.filter.outputs.e01 }}
      e02ab: ${{ steps.filter.outputs.e02ab }}
      e02d: ${{ steps.filter.outputs.e02d }}
      e02ef: ${{ steps.filter.outputs.e02ef }}
      e02ghi: ${{ steps.filter.outputs.e02ghi }}
      e03: ${{ steps.filter.outputs.e03 }}
      run_research: ${{ steps.filter.outputs.run_research }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          base=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            files=""
            all=true
          else
            files="$(git diff --name-only "$base" "$GITHUB_SHA")"
            all=false
          fi
          e01=false; e02ab=false; e02d=false; e02ef=false; e02ghi=false; e03=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" =~ ^(prototype|tests)/.*(e01_|test_e01_) ]]; then e01=true; fi
            if [[ "$path" =~ ^(prototype|tests)/.*(e02_higher_order|e02_ternary) ]]; then e02ab=true; fi
            if [[ "$path" =~ ^(prototype|tests)/.*e02_rule_ood ]]; then e02d=true; fi
            if [[ "$path" =~ ^(prototype|tests)/.*(e02e_discovery|e02f_falsification) ]]; then e02ef=true; fi
            if [[ "$path" =~ ^(prototype|tests)/.*(e02g_multienvironment|e02h_boolean_rules|e02i_streaming_drift) ]]; then e02ghi=true; fi
            if [[ "$path" =~ ^(prototype|tests)/.*(e03a_parallel_composition|e02i_relation_evolution) ]]; then e03=true; fi
            if [[ "$path" =~ ^(prototype|tests)/.*(cpg_ei_|test_cpg_ei_) ]]; then all=true; fi
            if [[ "$path" =~ ^(schemas|data)/ ]] || [[ "$path" =~ ^prototype/(symbolic_|composition_) ]]; then all=true; fi
          done <<< "$files"
          if [[ "$all" == true ]]; then
            e01=true; e02ab=true; e02d=true; e02ef=true; e02ghi=true; e03=true
          fi
          echo "e01=$e01" >> "$GITHUB_OUTPUT"
          echo "e02ab=$e02ab" >> "$GITHUB_OUTPUT"
          echo "e02d=$e02d" >> "$GITHUB_OUTPUT"
          echo "e02ef=$e02ef" >> "$GITHUB_OUTPUT"
          echo "e02ghi=$e02ghi" >> "$GITHUB_OUTPUT"
          echo "e03=$e03" >> "$GITHUB_OUTPUT"
          if [[ "$e01" == true || "$e02ab" == true || "$e02d" == true || "$e02ef" == true || "$e02ghi" == true || "$e03" == true ]]; then
            echo "run_research=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_research=false" >> "$GITHUB_OUTPUT"
          fi

  research-evaluations:
    needs: [unit-tests, detect-research]
    if: needs.detect-research.outputs.run_research == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: E01
            commands: |
              python -m prototype.e01_sparse_composition --json
              python -m prototype.e01_multiseed --seeds 5 --start-seed 7 --json
              python -m prototype.e01_ood_multiseed --seeds 5 --start-seed 7 --json
          - name: E02-A-B
            commands: |
              python -m prototype.e02_higher_order --seeds 5 --start-seed 7 --json
              python -m prototype.e02_ternary --examples 900 --seed 7
              python -m prototype.e02_ternary_learners --seeds 5 --start-seed 7 --json
          - name: E02-D
            commands: |
              python -m prototype.e02_rule_ood --seed 17 --support-size 6 --json
              python -m prototype.e02_rule_ood --sweep --seeds 100 --start-seed 100 --json
          - name: E02-E-F
            commands: |
              python -m prototype.e02e_discovery --seeds 20 --start-seed 7 --json
              python -m prototype.e02f_falsification --seeds 100 --start-seed 100
          - name: E02-G-H-I
            commands: |
              python -m prototype.e02g_multienvironment --seeds 50 --start-seed 700 --repeats 5
              python -m prototype.e02h_boolean_rules --seeds 30 --start-seed 900
              python -m prototype.e02i_streaming_drift --seeds 20 --start-seed 1200
          - name: E03-A-and-E02-I-evolution
            commands: |
              python -m prototype.e03a_parallel_composition --seeds 30 --start-seed 1500
              python -m prototype.e02i_relation_evolution --seeds 20 --start-seed 1200
    name: research-evaluations (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install "cryptography>=42,<47" "numpy>=1.26,<3"
      - name: Run evaluation group
        run: |
          ${{ matrix.commands }}
