name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run MTS-0 prequential smoke experiment
        run: |
          python -m prototype.mts0_runner \
            --seed 7 --train-samples 1200 --test-samples 400 --epochs 180 --json \
            > mts0-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("mts0-smoke.json").read_text())
          audit = result["audit"]
          assert audit["prediction_commits"] == 400
          assert audit["locked_test_reveals"] == 400
          assert audit["learner_visible_locked_test_reveals"] == 0
          assert audit["selector_visible_locked_test_reveals"] == 0
          assert audit["evaluator_visible_locked_test_reveals"] == 400
          assert audit["prediction_batch_sealed_before_reveal"] is True
          assert audit["all_predictions_committed_before_reveal"] is True
          assert audit["learner_and_evaluator_are_distinct_processes"] is True
          assert audit["evaluator_started_after_batch_seal"] is True
          assert audit["learner_received_locked_test_label_count"] == 0
          assert audit["evaluator_received_locked_test_label_count"] == 400
          assert audit["learner_pid"] != audit["evaluator_pid"]
          print(json.dumps({"metrics": result["metrics"], "audit": audit}, indent=2))
          PY
      - name: Run MTS-0 five-seed full-size evaluation
        run: |
          python -m prototype.mts0_runner \
            --seeds 5 --start-seed 7 --train-samples 1200 \
            --test-samples 400 --epochs 180 --json > mts0-five-seed.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("mts0-five-seed.json").read_text())
          assert result["seed_count"] == 5
          assert len(result["per_seed"]) == 5
          assert set(row["seed"] for row in result["per_seed"]) == {7, 8, 9, 10, 11}
          for row in result["per_seed"]:
              audit = row["audit"]
              assert audit["prediction_commits"] == 400
              assert audit["locked_test_reveals"] == 400
              assert audit["learner_visible_locked_test_reveals"] == 0
              assert audit["selector_visible_locked_test_reveals"] == 0
              assert audit["evaluator_visible_locked_test_reveals"] == 400
              assert audit["prediction_batch_sealed_before_reveal"] is True
              assert audit["all_predictions_committed_before_reveal"] is True
          print(json.dumps({
              "configuration": result["configuration"],
              "summary": result["summary"],
              "per_seed": result["per_seed"],
          }, indent=2))
          PY
      - name: Upload MTS-0 result artifact
        uses: actions/upload-artifact@v4
        with:
          name: mts0-five-seed-results
          path: mts0-five-seed.json
          if-no-files-found: error
      - name: Run E01 demonstration
        run: python -m prototype.e01_sparse_composition --json
      - name: Run E01-B five-seed evaluation
        run: python -m prototype.e01_multiseed --seeds 5 --start-seed 7 --json
      - name: Run E01-C compositional OOD evaluation
        run: python -m prototype.e01_ood_multiseed --seeds 5 --start-seed 7 --json
      - name: Run E02-A higher-order synergy evaluation
        run: python -m prototype.e02_higher_order --seeds 5 --start-seed 7 --json
      - name: Run E02-B ternary relation generator audit
        run: python -m prototype.e02_ternary --examples 900 --seed 7
      - name: Run E02-B pairwise vs third-order learners
        run: python -m prototype.e02_ternary_learners --seeds 5 --start-seed 7 --json
      - name: Run E02-C hyperedge lifecycle tests
        run: python -m unittest tests.test_e02_edge_lifecycle -v
      - name: Run E02-D held-out rule-family induction
        run: python -m prototype.e02_rule_ood --seed 17 --support-size 6 --json
      - name: Run E02-D multi-seed support identifiability sweep
        run: python -m prototype.e02_rule_ood --sweep --seeds 100 --start-seed 100 --json
