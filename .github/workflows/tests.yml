name: tests

on:
  push:
    branches: [main, research/e12a3-proposer-competition-2026-11-11]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run E12-A3 multi-proposer unit tests
        run: python -m unittest tests.test_e12a3_multi_proposer -v
      - name: Run E12-A3 multi-proposer smoke test
        run: python -m prototype.e12a3_multi_proposer
      - name: Run E12-A3 benchmark tests
        run: python -m unittest tests.test_e12a3_proposer_benchmark -v
      - name: Run E12-A3 adaptive allocator tests
        run: python -m unittest tests.test_e12a3_adaptive_allocator -v
      - name: Run E12-A3 adaptive benchmark tests
        run: python -m unittest tests.test_e12a3_adaptive_benchmark -v
      - name: Run E12-A3 reward ablation tests
        run: python -m unittest tests.test_e12a3_reward_ablation -v
      - name: Run E12-A3 Support-context router tests
        run: python -m unittest tests.test_e12a3_context_router -v
      - name: Run E12-A3 four-way adaptive benchmark
        run: python -m prototype.e12a3_adaptive_benchmark --seeds 20 --start-seed 1 --budget 31 --json > /tmp/e12a3-m1-four-way.json
      - name: Upload E12-A3 four-way benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: e12a3-m1-four-way-benchmark
          path: /tmp/e12a3-m1-four-way.json
          if-no-files-found: error
      - name: Run E12-A3 M1.1 reward ablation benchmark
        run: python -m prototype.e12a3_reward_ablation --seeds 20 --start-seed 1 --budget 31 --json > /tmp/e12a3-m1-1-reward-ablation.json
      - name: Upload E12-A3 M1.1 reward ablation artifact
        uses: actions/upload-artifact@v4
        with:
          name: e12a3-m1-1-reward-ablation
          path: /tmp/e12a3-m1-1-reward-ablation.json
          if-no-files-found: error
      - name: Run E12-A3 M1.2 Support-context router benchmark
        run: python -m prototype.e12a3_context_router --seeds 20 --start-seed 1 --budget 31 --json > /tmp/e12a3-m1-2-context-router.json
      - name: Upload E12-A3 M1.2 context-router artifact
        uses: actions/upload-artifact@v4
        with:
          name: e12a3-m1-2-context-router
          path: /tmp/e12a3-m1-2-context-router.json
          if-no-files-found: error
      - name: Run E12-A3 20-seed equal-budget benchmark
        run: python -m prototype.e12a3_proposer_benchmark --seeds 20 --start-seed 1 --budget 31 --json
      - name: Run E01 demonstration
        run: python -m prototype.e01_sparse_composition --json
      - name: Run E01-B five-seed evaluation
        run: python -m prototype.e01_multiseed --seeds 5 --start-seed 7 --json
      - name: Run E01-C compositional OOD evaluation
        run: python -m prototype.e01_ood_multiseed --seeds 5 --start-seed 7 --json
      - name: Run E02-A higher-order synergy evaluation
        run: python -m prototype.e02_higher_order --seeds 5 --start-seed 7 --json
      - name: Run E02-B ternary relation generator audit
        run: python -m prototype.e02_ternary --examples 900 --seed 7
      - name: Run E02-B pairwise vs third-order learners
        run: python -m prototype.e02_ternary_learners --seeds 5 --start-seed 7 --json
      - name: Run E02-C hyperedge lifecycle tests
        run: python -m unittest tests.test_e02_edge_lifecycle -v
      - name: Run E02-D held-out rule-family induction
        run: python -m prototype.e02_rule_ood --seed 17 --support-size 6 --json
      - name: Run E02-D multi-seed support identifiability sweep
        run: python -m prototype.e02_rule_ood --sweep --seeds 100 --start-seed 100 --json
