name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, research/e09-shared-protocol-mainline-validation-2026-11-11, research/e10-shared-protocol-adapter-2026-11-11]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run E10-A finite relational prequential experiment
        run: python -m prototype.e10a_prequential_experiment --seed 17 --json
      - name: Run E10-A isolated learner process
        run: python -m prototype.e10a_prequential_experiment --seed 101 --mode all --learner-backend subprocess --json
      - name: Run E10-A ten-seed update-strategy sweep
        run: python -m prototype.e10a_prequential_experiment --sweep --seeds 10 --start-seed 100 --json
      - name: Run E10-B renamed-schema and OOD abstention audit
        run: python -m prototype.e10b_transfer_experiment
      - name: Run E10-B.2 multi-seed positive-support ablation curve
        run: python -m prototype.e10b_ablation_curve --seeds 5 --start-seed 200
      - name: Run E10-B.3 opaque relation identifiability boundary
        run: python -m prototype.e10b_relation_ood_identifiability
      - name: Run E01 demonstration
        run: python -m prototype.e01_sparse_composition --json
      - name: Run E01-B five-seed evaluation
        run: python -m prototype.e01_multiseed --seeds 5 --start-seed 7 --json
      - name: Run E01-C compositional OOD evaluation
        run: python -m prototype.e01_ood_multiseed --seeds 5 --start-seed 7 --json
      - name: Run E02-A higher-order synergy evaluation
        run: python -m prototype.e02_higher_order --seeds 5 --start-seed 7 --json
      - name: Run E02-B ternary relation generator audit
        run: python -m prototype.e02_ternary --examples 900 --seed 7
      - name: Run E02-B pairwise vs third-order learners
        run: python -m prototype.e02_ternary_learners --seeds 5 --start-seed 7 --json
      - name: Run E02-C hyperedge lifecycle tests
        run: python -m unittest tests.test_e02_edge_lifecycle -v
      - name: Run E02-D per-rule held-out-query identifiability
        run: python -m prototype.e02_rule_ood --seed 17 --support-size 6 --json
      - name: Run E02-D multi-seed support identifiability sweep
        run: python -m prototype.e02_rule_ood --sweep --seeds 100 --start-seed 100 --json
