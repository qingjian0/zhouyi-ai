name: cpg-ei-learning-rate-confirmation

on:
  push:
    branches:
      - research/cpg-ei-lr-confirmation-2026-11-13
  pull_request:
    branches:
      - research/cpg-ei-oracle-optimizer-sweep-2026-11-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-rate-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run optimizer sweep tests
        run: python -m unittest tests.test_cpg_ei_oracle_optimizer_sweep -v
      - name: Run five-fresh-seed learning-rate confirmation
        run: |
          mkdir -p benchmark-results
          python -m prototype.cpg_ei_oracle_optimizer_sweep \
            --seeds 173,211,257,307,353 \
            --learning-rates 0.35,0.7,1.0,1.4,2.0 \
            --epochs 800 | tee benchmark-results/cpg-ei-learning-rate-confirmation.json
      - name: Upload confirmation report
        uses: actions/upload-artifact@v4
        with:
          name: cpg-ei-learning-rate-confirmation-${{ github.sha }}
          path: benchmark-results/cpg-ei-learning-rate-confirmation.json
          if-no-files-found: error
          retention-days: 30
