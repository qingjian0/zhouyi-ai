name: CPG-EI compositional out-of-grammar benchmark

on:
  push:
    branches:
      - research/cpg-ei-compositional-ood-benchmark-v1-2026-11-13
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  compositional-ood:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run leakage and deterministic contract tests
        run: python -m unittest discover -s tests -p 'test_cpg_ei_compositional_ood.py' -v
      - name: Run three-seed compositional OOD benchmark
        run: |
          python -m prototype.cpg_ei_compositional_ood \
            --seeds 20261114 20261115 20261116 \
            --families 8 --input-dim 6 --output-dim 4 \
            --max-epochs 120 --patience 15 \
            --json artifacts/compositional-ood.json
      - name: Upload machine-readable benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: zhouyi-cpg-ei-compositional-ood-v1
          path: artifacts/compositional-ood.json
          if-no-files-found: error
          retention-days: 30
