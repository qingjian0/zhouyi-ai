name: Orchestrator tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "cryptography>=42,<47" "numpy>=1.26,<3"
      - run: python -m unittest discover -s tests -v
      - run: python -m orchestrator.cli orchestrator/examples/quickstart.json --plan
