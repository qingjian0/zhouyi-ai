name: cpg-ei-multiseed-diagnostic

on:
  push:
    branches:
      - research/cpg-ei-multiseed-diagnostics-rebased-2026-11-12
      - research/cpg-ei-second-parity-teacher-rebased-2026-11-12
      - research/cpg-ei-joint-motif-proposals-2026-11-12
  pull_request:
    branches:
      - research/cpg-ei-learnable-gates-v3-2026-11-12
      - research/cpg-ei-multiseed-diagnostics-rebased-2026-11-12

jobs:
  multiseed-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run CPG-EI structure discovery tests
        run: python -m unittest tests.test_cpg_ei_structure_discovery tests.test_cpg_ei_joint_proposals -v
