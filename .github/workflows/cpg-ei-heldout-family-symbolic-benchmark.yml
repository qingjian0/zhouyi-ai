name: CPG-EI held-out-family few-shot symbolic baseline

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fewshot-symbolic:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/cpg-ei-heldout-family-fewshot-symbolic-v1-2026-11-13'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run held-out-family protocol and symbolic baseline tests
        run: |
          python -m unittest discover -s tests -p 'test_cpg_ei_heldout_family_protocol.py' -v
          python -m unittest discover -s tests -p 'test_cpg_ei_heldout_family_symbolic.py' -v
      - name: Run 3-seed 1,600-family few-shot benchmark
        run: |
          python -m prototype.cpg_ei_heldout_family_symbolic \
            --families 1600 --input-dim 8 --output-dim 8 \
            --seeds 20261114 20261115 20261116 \
            --support-sizes 16 32 64 \
            --json artifacts/heldout-family-fewshot-symbolic.json
      - name: Upload few-shot benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhouyi-cpg-ei-heldout-family-fewshot-v1
          path: artifacts/heldout-family-fewshot-symbolic.json
          if-no-files-found: error
